version: '3.8'

services:
  # Serviço Web (O Site)
  web:
    build: .
    command: python run_production.py
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - redis

  # Serviço Worker (O Processamento)
  worker:
    build: .
    command: python worker.py
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - redis

  # Banco de Dados de Memória (Redis)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
