<!DOCTYPE html>
<html lang="pt-br" class="dark" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>OVERRIDE.AI | Galeria de Projetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { neon: '#00FF41', dark: '#020204', darker: '#010102' } },
                    fontFamily: { mono: ['JetBrains Mono', 'monospace'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020204 !important; color: white; overflow-x: hidden; }
        *:focus { outline: none !important; }

        .matrix-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; opacity: 0.08;
            background-image: radial-gradient(circle at 50% 50%, rgba(0,255,65,0.05) 0%, transparent 50%),
                              linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px;
        }

        @keyframes glitch {
            0%, 100% { opacity: 1; transform: skew(0); }
            3%  { opacity: 0.8; transform: skew(2deg); }
            6%  { opacity: 0.4; transform: skew(-2deg); }
        }
        .animate-glitch { animation: glitch 4s infinite; display: inline-block; text-shadow: 0 0 10px rgba(0,255,65,0.5); }

        .project-card {
            background: rgba(8,8,10,0.8);
            border: 1px solid rgba(255,255,255,0.07);
            transition: all 0.25s;
            cursor: pointer;
        }
        .project-card:hover {
            border-color: #00FF41;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,255,65,0.08);
        }

        .btn-nuclear {
            background: #00FF41; color: black; font-weight: 900;
            letter-spacing: 1px; text-transform: uppercase;
            font-family: 'JetBrains Mono'; transition: 0.2s; border-radius: 4px;
        }
        .btn-nuclear:hover { background: white; box-shadow: 0 0 20px rgba(0,255,65,0.5); }

        .btn-danger {
            background: transparent; color: #ff4466;
            border: 1px solid rgba(255,68,102,0.4);
            font-family: 'JetBrains Mono'; font-size: 0.7rem;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; transition: 0.2s; border-radius: 4px;
            padding: 0.4rem 0.75rem;
        }
        .btn-danger:hover { background: rgba(255,68,102,0.15); border-color: #ff4466; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px); z-index: 100;
            display: flex; align-items: flex-start; justify-content: center;
            overflow-y: auto; padding: 2rem 1rem;
        }
        .modal-box {
            background: #010102; border: 1px solid rgba(0,255,65,0.25);
            border-radius: 8px; width: 100%; max-width: 900px;
            position: relative; animation: slideIn 0.2s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .thumb-img {
            width: 100%; height: 120px; object-fit: cover;
            background: #08080a; display: block;
        }
        .thumb-placeholder {
            width: 100%; height: 120px; background: #08080a;
            display: flex; align-items: center; justify-content: center;
        }

        .badge-tipo {
            font-family: 'JetBrains Mono'; font-size: 0.6rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 2px 8px; border-radius: 3px;
        }
        .badge-youtube { background: rgba(255,0,0,0.15); color: #ff6666; border: 1px solid rgba(255,0,0,0.2); }
        .badge-upload  { background: rgba(0,255,65,0.1);  color: #00FF41; border: 1px solid rgba(0,255,65,0.2); }

        .empty-state { text-align: center; padding: 5rem 2rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #010102; }
        ::-webkit-scrollbar-thumb { background: #00FF41; border-radius: 3px; }

        #toast {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
            background: #010102; border: 1px solid rgba(0,255,65,0.3);
            color: #00FF41; font-family: 'JetBrains Mono'; font-size: 0.75rem;
            padding: 0.75rem 1.25rem; border-radius: 6px;
            transition: opacity 0.3s; pointer-events: none;
        }
        #toast.hidden { opacity: 0; }
    </style>
</head>

<body class="antialiased flex flex-col items-center">
    <div class="matrix-bg"></div>

    <!-- Nav -->
    <nav class="w-full h-14 md:h-20 border-b border-white/5 bg-[#010102]/95 backdrop-blur flex items-center justify-between px-4 md:px-8 sticky top-0 z-50">
        <div class="flex items-center gap-2 md:gap-3">
            <i class="fa-solid fa-terminal text-brand-neon text-sm md:text-xl"></i>
            <span class="font-mono font-bold text-base md:text-xl text-white tracking-tighter">UBER_HIT<span class="text-brand-neon">.AI</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/" class="text-[10px] md:text-xs font-mono uppercase text-gray-500 hover:text-brand-neon transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i>Command Center
            </a>
            <span class="text-[10px] md:text-xs font-mono uppercase text-gray-500">
                <i class="fa-solid fa-circle text-brand-neon text-[6px] md:text-[8px] mr-1 animate-pulse"></i>Online
            </span>
        </div>
    </nav>

    <main class="w-full max-w-6xl mt-8 md:mt-12 px-4 pb-20 z-10">

        <!-- Header -->
        <div class="mb-8 md:mb-12">
            <h1 class="text-3xl md:text-6xl font-black uppercase text-white tracking-tight leading-none mb-2">
                ARQUIVO <span class="text-brand-neon animate-glitch">OPERACIONAL</span>
            </h1>
            <p class="text-xs md:text-sm font-mono text-gray-500 mt-3">
                Todos os projetos gerados. Clique para visualizar os cortes.
            </p>
        </div>

        <!-- Stats bar -->
        <div id="stats-bar" class="flex gap-6 mb-8 font-mono text-xs text-gray-500 border-b border-white/5 pb-6 hidden">
            <span><span id="stat-total" class="text-brand-neon font-bold">0</span> projetos</span>
            <span><span id="stat-cortes" class="text-white font-bold">0</span> cortes gerados</span>
        </div>

        <!-- Projects grid -->
        <div id="loading-state" class="empty-state">
            <i class="fa-solid fa-spinner text-brand-neon text-3xl animate-spin mb-4"></i>
            <p class="font-mono text-xs text-gray-500 uppercase">Carregando projetos...</p>
        </div>

        <div id="empty-state" class="empty-state hidden">
            <i class="fa-solid fa-folder-open text-gray-700 text-5xl mb-6"></i>
            <h2 class="font-black text-white text-xl uppercase mb-2">Nenhum projeto ainda</h2>
            <p class="font-mono text-xs text-gray-500 mb-6">Processe um vídeo para criar seu primeiro projeto.</p>
            <a href="/" class="btn-nuclear px-6 py-3 text-sm inline-block">
                <i class="fa-solid fa-bolt mr-2"></i>Iniciar Operação
            </a>
        </div>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 hidden"></div>
    </main>

    <!-- Modal de projeto -->
    <div id="modal" class="modal-overlay hidden" onclick="closeModalOutside(event)">
        <div class="modal-box">
            <div class="flex items-center justify-between p-5 md:p-6 border-b border-white/10">
                <div>
                    <h2 id="modal-title" class="font-black text-white text-lg md:text-2xl uppercase"></h2>
                    <p id="modal-meta" class="font-mono text-xs text-gray-500 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white transition-colors ml-4 flex-shrink-0">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-cortes" class="p-5 md:p-6 flex flex-col gap-6"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden"></div>

    <script>
        let _projetos = [];

        async function loadProjetos() {
            try {
                const res  = await fetch('/api/projetos');
                const data = await res.json();
                _projetos  = data;
                renderProjetos(data);
            } catch (e) {
                document.getElementById('loading-state').innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-4"></i>
                    <p class="font-mono text-xs text-red-400 uppercase">Erro ao carregar projetos</p>`;
            }
        }

        function renderProjetos(projetos) {
            document.getElementById('loading-state').classList.add('hidden');

            if (!projetos.length) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            // Stats
            const totalCortes = projetos.reduce((s, p) => s + (p.qtd_cortes || 0), 0);
            document.getElementById('stat-total').textContent  = projetos.length;
            document.getElementById('stat-cortes').textContent = totalCortes;
            document.getElementById('stats-bar').classList.remove('hidden');

            const grid = document.getElementById('projects-grid');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            projetos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card rounded-xl overflow-hidden';
                card.dataset.id = p.project_id;

                // Thumbnail strip (até 3 thumbs)
                const thumbs = (p.cortes || []).slice(0, 3);
                const thumbHtml = thumbs.length
                    ? `<div class="flex gap-0.5 bg-black">
                        ${thumbs.map(c => c.thumb_url
                            ? `<img src="${c.thumb_url}" class="thumb-img flex-1" onerror="this.parentNode.replaceChild(placeholder(),this)">`
                            : `<div class="thumb-placeholder flex-1"><i class="fa-solid fa-film text-gray-700 text-2xl"></i></div>`
                        ).join('')}
                       </div>`
                    : `<div class="thumb-placeholder"><i class="fa-solid fa-film text-gray-700 text-3xl"></i></div>`;

                const data = new Date(p.criado_em);
                const dataStr = data.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
                const horaStr = data.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
                const badgeClass = p.tipo === 'youtube' ? 'badge-youtube' : 'badge-upload';
                const badgeIcon  = p.tipo === 'youtube' ? 'fa-youtube fa-brands' : 'fa-file-video fa-solid';
                const badgeLabel = p.tipo === 'youtube' ? 'YouTube' : 'Upload';

                card.innerHTML = `
                    ${thumbHtml}
                    <div class="p-4">
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <h3 class="font-black text-white text-sm uppercase leading-tight flex-1">${escHtml(p.nome)}</h3>
                            <span class="badge-tipo ${badgeClass} flex-shrink-0">
                                <i class="${badgeIcon} mr-1"></i>${badgeLabel}
                            </span>
                        </div>
                        <div class="flex items-center gap-3 font-mono text-[10px] text-gray-500 mb-4">
                            <span><i class="fa-regular fa-calendar mr-1"></i>${dataStr} ${horaStr}</span>
                            <span class="text-brand-neon font-bold">
                                <i class="fa-solid fa-scissors mr-1"></i>${p.qtd_cortes || 0} cortes
                            </span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openModal('${p.project_id}')" class="btn-nuclear flex-1 py-2.5 text-xs">
                                <i class="fa-solid fa-play mr-1.5"></i>Ver Cortes
                            </button>
                            <button onclick="confirmDelete(event,'${p.project_id}')" class="btn-danger">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>`;

                grid.appendChild(card);
            });
        }

        function openModal(projectId) {
            const p = _projetos.find(x => x.project_id === projectId);
            if (!p) return;

            const data    = new Date(p.criado_em);
            const dataStr = data.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' });
            const horaStr = data.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

            document.getElementById('modal-title').textContent = p.nome;
            document.getElementById('modal-meta').textContent  =
                `${dataStr} ${horaStr} · ${p.qtd_cortes || 0} cortes · ${p.tipo === 'youtube' ? 'YouTube' : 'Upload'}`;

            const cortes = p.cortes || [];
            const container = document.getElementById('modal-cortes');

            if (!cortes.length) {
                container.innerHTML = `<p class="font-mono text-xs text-gray-500 text-center py-8">Nenhum corte encontrado.</p>`;
            } else {
                container.innerHTML = cortes.map(c => `
                    <div class="bg-[#050507] border border-white/8 rounded-lg overflow-hidden flex flex-col md:flex-row">
                        <div class="w-full md:w-[280px] bg-black flex-shrink-0 h-[220px] md:h-auto flex items-center justify-center">
                            <video src="/download/${escHtml(c.arquivo)}" controls
                                   class="w-full h-full object-contain max-h-[320px]"></video>
                        </div>
                        <div class="p-4 md:p-5 flex flex-col justify-between flex-1">
                            <div>
                                <div class="flex items-center justify-between mb-3 gap-2">
                                    <h4 class="font-bold text-white text-sm uppercase">${escHtml(c.titulo || 'Corte')}</h4>
                                    <span class="bg-brand-neon text-black text-[10px] font-black px-2 py-0.5 rounded flex-shrink-0">
                                        SCORE ${c.score || 0}%
                                    </span>
                                </div>
                                ${c.duracao ? `<p class="font-mono text-[10px] text-gray-500 mb-2"><i class="fa-regular fa-clock mr-1"></i>${c.duracao}s</p>` : ''}
                                ${c.justificativa ? `
                                <p class="text-xs text-gray-400 font-mono italic border-l-2 border-brand-neon/40 pl-3 leading-relaxed">
                                    "${escHtml(c.justificativa)}"
                                </p>` : ''}
                            </div>
                            <a href="/download/${escHtml(c.arquivo)}" download
                               class="btn-nuclear py-3 text-xs text-center block w-full mt-4">
                                <i class="fa-solid fa-download mr-2"></i>Baixar MP4
                            </a>
                        </div>
                    </div>`).join('');
            }

            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function closeModalOutside(e) {
            if (e.target === document.getElementById('modal')) closeModal();
        }

        async function confirmDelete(e, projectId) {
            e.stopPropagation();
            if (!confirm('Deletar este projeto e todos os seus cortes? Esta ação não pode ser desfeita.')) return;

            try {
                const res = await fetch(`/api/projetos/${projectId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Falha ao deletar');
                showToast('Projeto deletado.');
                _projetos = _projetos.filter(p => p.project_id !== projectId);
                renderProjetos(_projetos);
            } catch (e) {
                showToast('Erro ao deletar projeto.', true);
            }
        }

        function showToast(msg, error = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.color = error ? '#ff4466' : '#00FF41';
            t.style.borderColor = error ? 'rgba(255,68,102,0.3)' : 'rgba(0,255,65,0.3)';
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        loadProjetos();
    </script>
</body>
</html>
